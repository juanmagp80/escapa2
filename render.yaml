# Render blueprint for Escapa2 Radar backend.

services:
  - type: web
    name: escapa2-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: PERSISTENCE_BACKEND
        value: memory

      - key: GEMINI_ENABLED
        value: "true"

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.6-flash

      - key: FIREBASE_ENABLED
        value: "true"

      - key: FIREBASE_PROJECT_ID
        value: escapa2-e0196

      # Paste the full content of the Firebase service account JSON in the
      # dashboard when prompted (write-only secret, never committed).
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
