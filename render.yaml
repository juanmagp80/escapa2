# Render blueprint for Escapa2 Radar backend.

services:
  - type: web
    name: escapa2-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: PERSISTENCE_BACKEND
        value: memory

      - key: GEMINI_ENABLED
        value: "true"

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.6-flash
